<div class="accounts-container">
  <h2 class="section-title">Connected Gmail Accounts</h2>

  <div *ngIf="loading && message">
    <p>{{ message }}</p>
  </div>

  <div *ngIf="!loading && accounts?.length; else noAccounts">
    <ul class="accounts-list">
      <li *ngFor="let acc of accounts" class="account-item">
        <span class="account-email">{{ acc.email }}</span>
      </li>
    </ul>
  </div>

  <ng-template #noAccounts>
    <p class="placeholder-text" *ngIf="!message">No Gmail accounts connected yet.</p>
    <p class="placeholder-text" *ngIf="message">{{ message }}</p>
  </ng-template>

  <button class="connect-btn" (click)="connectNewAccount()" [disabled]="loading">
    <span *ngIf="!loading">➕ Connect New Account</span>
    <span *ngIf="loading">Connecting...</span>
  </button>
</div>
